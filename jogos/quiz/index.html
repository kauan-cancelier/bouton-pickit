<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz Relâmpago</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    overflow: hidden;
    user-select: none;
    touch-action: manipulation;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2vh 2vw;
  }

  header {
    width: 100%;
    max-width: 1400px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1vh 0 2vh;
    flex-shrink: 0;
  }

  h1 {
    font-size: clamp(28px, 4.5vw, 64px);
    font-weight: 800;
    letter-spacing: 1px;
  }

  .stats {
    display: flex;
    gap: 3vw;
    font-size: clamp(18px, 2.5vw, 36px);
    font-weight: 600;
  }

  .stats span { color: #ffd166; }

  #timerbar {
    width: min(92vw, 1400px);
    height: 1.5vmin;
    background: rgba(255,255,255,0.12);
    border-radius: 1vmin;
    overflow: hidden;
    flex-shrink: 0;
    margin-bottom: 3vh;
  }

  #timerfill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #06d6a0, #ffd166);
    transition: width 0.2s linear;
  }

  #timerfill.low { background: #f72585; }

  #question {
    font-size: clamp(26px, 4vw, 58px);
    font-weight: 700;
    text-align: center;
    max-width: 90vw;
    padding: 2vh 0 4vh;
    flex-shrink: 0;
  }

  #options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2vmin;
    width: min(92vw, 1400px);
    flex: 1;
    max-height: 55vh;
  }

  .opt {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2vmin;
    font-size: clamp(20px, 3.5vmin, 44px);
    font-weight: 600;
    border-radius: 2vmin;
    background: linear-gradient(145deg, #4361ee, #3a0ca3);
    border: 0.4vmin solid rgba(255,255,255,0.15);
    cursor: pointer;
  }

  .opt:active { filter: brightness(1.3); }
  .opt.right { background: #2b9348; border-color: #52b788; animation: pop 0.4s ease; }
  .opt.wrong { background: #9d0208; border-color: #f72585; opacity: 0.7; }
  .opt.dim { opacity: 0.35; pointer-events: none; }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 25, 0.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
    z-index: 10;
    text-align: center;
    padding: 4vw;
  }

  #overlay.show { display: flex; }

  #overlay h2 {
    font-size: clamp(40px, 8vw, 110px);
    color: #ffd166;
  }

  #overlay p { font-size: clamp(22px, 3.5vw, 48px); }

  #overlay button {
    font-size: clamp(24px, 3.5vw, 48px);
    font-weight: 700;
    padding: 2.5vmin 6vmin;
    border: none;
    border-radius: 3vmin;
    background: linear-gradient(145deg, #06d6a0, #118ab2);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 0.8vmin 1.6vmin rgba(0,0,0,0.4);
  }

  #overlay button:active { transform: scale(0.96); }
</style>
</head>
<body>

<header>
  <h1>⚡ Quiz Relâmpago</h1>
  <div class="stats">
    <div>Pontos: <span id="score">0</span></div>
    <div>Pergunta: <span id="progress">1</span></div>
  </div>
</header>

<div id="timerbar"><div id="timerfill"></div></div>
<div id="question"></div>
<div id="options"></div>

<div id="overlay">
  <h2 id="finalTitle"></h2>
  <p id="finalText"></p>
  <button id="restart">Jogar de novo</button>
</div>

<script>
// Perguntas — edite esta lista: pergunta, 4 opções, índice da correta (0-3)
const PERGUNTAS = [
  { p: 'O que significa HTML?', o: ['HyperText Markup Language', 'HighText Machine Language', 'Home Tool Markup Language', 'Hyperlink Text Mode Language'], c: 0 },
  { p: 'Qual estrutura repete um bloco N vezes?', o: ['if', 'for', 'return', 'switch'], c: 1 },
  { p: 'Qual destas NÃO é linguagem de programação?', o: ['Python', 'Java', 'HTTP', 'C#'], c: 2 },
  { p: 'Em UML, uma herança é representada por:', o: ['Linha tracejada', 'Seta com ponta vazada (triângulo)', 'Losango preenchido', 'Seta dupla'], c: 1 },
  { p: 'Qual comando SQL busca dados?', o: ['INSERT', 'UPDATE', 'DELETE', 'SELECT'], c: 3 },
  { p: 'O que é um bug?', o: ['Um erro no programa', 'Um vírus de computador', 'Um tipo de hardware', 'Uma linguagem antiga'], c: 0 },
  { p: 'Qual símbolo representa comentário de linha em JS/Java?', o: ['#', '//', '<!-- -->', '**'], c: 1 },
  { p: 'Git serve para:', o: ['Compilar código', 'Controle de versão', 'Criar banco de dados', 'Testar rede'], c: 1 },
];

const TEMPO = 15; // segundos por pergunta

const qEl = document.getElementById('question');
const optEl = document.getElementById('options');
const scoreEl = document.getElementById('score');
const progEl = document.getElementById('progress');
const fillEl = document.getElementById('timerfill');
const overlay = document.getElementById('overlay');
const finalTitle = document.getElementById('finalTitle');
const finalText = document.getElementById('finalText');
const restartBtn = document.getElementById('restart');

let idx = 0, score = 0, timeLeft = TEMPO, timer = null, locked = false;

function build() {
  idx = 0;
  score = 0;
  overlay.classList.remove('show');
  scoreEl.textContent = '0';
  showQuestion();
}

function showQuestion() {
  locked = false;
  progEl.textContent = `${idx + 1}/${PERGUNTAS.length}`;
  const q = PERGUNTAS[idx];
  qEl.textContent = q.p;
  optEl.innerHTML = '';
  const order = q.o.map((_, i) => i).sort(() => Math.random() - 0.5);
  order.forEach(i => {
    const d = document.createElement('div');
    d.className = 'opt';
    d.textContent = q.o[i];
    d.addEventListener('click', () => answer(d, i === q.c));
    optEl.appendChild(d);
  });
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = TEMPO;
  fillEl.style.width = '100%';
  fillEl.classList.remove('low');
  timer = setInterval(() => {
    timeLeft -= 0.2;
    fillEl.style.width = `${(timeLeft / TEMPO) * 100}%`;
    if (timeLeft <= 5) fillEl.classList.add('low');
    if (timeLeft <= 0) {
      clearInterval(timer);
      answer(null, false);
    }
  }, 200);
}

function answer(el, correct) {
  if (locked) return;
  locked = true;
  clearInterval(timer);
  const q = PERGUNTAS[idx];
  [...optEl.children].forEach((d, i) => {
    const isRight = d.textContent === q.o[q.c];
    if (isRight) d.classList.add('right');
    else if (d === el) d.classList.add('wrong');
    else d.classList.add('dim');
  });
  if (correct) {
    score += 10 + Math.ceil(timeLeft);
    scoreEl.textContent = score;
  }
  setTimeout(() => {
    idx++;
    if (idx < PERGUNTAS.length) showQuestion();
    else end();
  }, 1400);
}

function end() {
  const total = PERGUNTAS.length;
  const acertos = Math.round(score / 25); // aproximação: resposta média vale ~22
  finalTitle.textContent = score >= total * 15 ? '🏆 Mandaram bem!' : '💪 Boa tentativa!';
  finalText.textContent = `Pontuação final: ${score} pontos`;
  overlay.classList.add('show');
}

restartBtn.addEventListener('click', build);
build();
</script>
</body>
</html>
